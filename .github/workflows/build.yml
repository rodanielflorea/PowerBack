name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Installers go to the public ace-releases repo, where installed copies look
# for updates. Needs the RELEASES_TOKEN secret: a token with Contents
# read/write on rodanielflorea/ace-releases.
# electron-builder publishes the installers to a GitHub release on tag
# builds; the default GITHUB_TOKEN is read-only, so grant release write.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          # No macOS here: the Mac app is built on the Mac laptop
          # (`npm run build:mac`, signed with "Ace Local Signing" so updates
          # keep one identity) and its files are uploaded to the same release.
          # The macOS steps below stay for the day it is built here again.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run icon
      # The Windows installer's header and sidebar pictures (build/*.bmp, not in
      # the repository); without them the NSIS build fails.
      - run: npm run installer-art

      # No API keys are built in any more (2.7.26 on): every copy gets them
      # from ace2me.com after its computer is approved.

      # Windows / Linux: never look for a code-signing identity.
      - name: Build Windows / Linux
        if: matrix.os != 'macos-latest'
        run: npx electron-builder ${{ matrix.args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # macOS: universal (x86_64 + arm64) .dmg + .zip.
      # If MAC_CSC_LINK is set (Developer ID Application .p12, base64),
      # electron-builder signs with that identity. If APPLE_ID +
      # APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (or the App Store
      # Connect API key trio) are also set, it notarizes and staples.
      # With no cert, a universal ad-hoc build is still produced; Gatekeeper
      # will block it until the user right-clicks Open or runs xattr.
      - name: Build macOS helpers (system audio, remote control)
        if: matrix.os == 'macos-latest'
        run: bash mac-audio/build.sh

      # npm installs the @napi-rs/canvas binary for this runner's CPU only
      # (arm64). The PDF reader needs it, so without the x64 one every PDF
      # upload fails on an Intel Mac. Same step as in `npm run build:mac`.
      - name: Install both macOS canvas binaries (PDF upload on Intel Macs)
        if: matrix.os == 'macos-latest'
        run: node scripts/install-mac-canvas.js

      - name: Build macOS (universal, sign + notarize when secrets exist)
        if: matrix.os == 'macos-latest'
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Developer ID cert present — will sign"
          else
            echo "No MAC_CSC_LINK secret — unsigned/ad-hoc universal build"
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Notarization credentials present — will notarize"
          elif [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "App Store Connect API key present — will notarize"
          else
            echo "No notarization credentials — Gatekeeper will still warn"
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          # Hardened runtime needs a real signature; an unsigned/ad-hoc build with
          # it enabled cannot use the microphone (re-prompts forever).
          HARDENED=false; [ -n "$CSC_LINK" ] && HARDENED=true
          npx electron-builder --mac -c.mac.hardenedRuntime=$HARDENED --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Installers also go to a GitHub release (draft for branch builds), which
      # is what build-all downloads; the artifact upload is a best-effort extra
      # and never fails the build over the artifact storage quota.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
