name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# electron-builder publishes the installers to a GitHub release on tag
# builds; the default GITHUB_TOKEN is read-only, so grant release write.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run icon

      # Built-in provider keys: the committed defaults/api-keys.json is empty on
      # purpose. Put the real JSON in the repository secret API_KEYS_JSON
      # (Settings → Secrets and variables → Actions) and CI writes it here.
      - name: Write built-in API keys from secret
        if: env.API_KEYS_JSON != ''
        shell: bash
        run: node -e "JSON.parse(process.env.API_KEYS_JSON); require('fs').writeFileSync('defaults/api-keys.json', process.env.API_KEYS_JSON)" && echo "api-keys.json written from secret"
        env:
          API_KEYS_JSON: ${{ secrets.API_KEYS_JSON }}

      # Windows / Linux: never look for a code-signing identity.
      - name: Build Windows / Linux
        if: matrix.os != 'macos-latest'
        run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # macOS: universal (x86_64 + arm64) .dmg + .zip.
      # If MAC_CSC_LINK is set (Developer ID Application .p12, base64),
      # electron-builder signs with that identity. If APPLE_ID +
      # APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (or the App Store
      # Connect API key trio) are also set, it notarizes and staples.
      # With no cert, a universal ad-hoc build is still produced; Gatekeeper
      # will block it until the user right-clicks Open or runs xattr.
      - name: Build macOS (universal, sign + notarize when secrets exist)
        if: matrix.os == 'macos-latest'
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Developer ID cert present — will sign"
          else
            echo "No MAC_CSC_LINK secret — unsigned/ad-hoc universal build"
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Notarization credentials present — will notarize"
          elif [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            echo "App Store Connect API key present — will notarize"
          else
            echo "No notarization credentials — Gatekeeper will still warn"
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          # Hardened runtime needs a real signature; an unsigned/ad-hoc build with
          # it enabled cannot use the microphone (re-prompts forever).
          HARDENED=false; [ -n "$CSC_LINK" ] && HARDENED=true
          npx electron-builder --mac -c.mac.hardenedRuntime=$HARDENED --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
