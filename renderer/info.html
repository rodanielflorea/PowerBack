<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Info</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="info.css" />
</head>
<body>
  <header class="info-header">
    <span class="info-loc" id="infoLoc">—</span>
    <div class="info-header-btns">
      <button class="info-btn" id="infoRefresh" title="Refresh">&#8635;</button>
      <button class="info-btn" id="infoClose" title="Close">&times;</button>
    </div>
  </header>

  <div class="info-scroll">
    <!-- The things looked at most, in one strip at the top: time, weather, salary. -->
    <section class="info-top">
      <div class="info-top-row">
        <div class="info-clock">
          <div class="info-time" id="infoTime">--:--</div>
          <div class="info-date"><span id="infoDate">—</span><span class="info-tz" id="infoTz"></span></div>
        </div>
        <div class="info-weather" id="infoWeather"><span class="info-dim">…</span></div>
      </div>
      <div class="info-salary" id="infoSalary" hidden>
        <span class="info-salary-label">Salary</span><span class="info-salary-value" id="infoSalaryValue"></span>
      </div>
    </section>

    <section class="info-block" id="infoWorkBlock">
      <div class="info-block-label">Work history</div>
      <div class="cv-list" id="infoWork"><span class="info-dim">Loading…</span></div>
    </section>

    <section class="info-block" id="infoEduBlock">
      <div class="info-block-label">Education</div>
      <div class="cv-list" id="infoEdu"><span class="info-dim">Loading…</span></div>
    </section>

    <section class="info-block" id="infoHolidaysBlock">
      <div class="info-block-label">Holidays</div>
      <div class="info-holidays" id="infoHolidays"><span class="info-dim">Loading…</span></div>
    </section>

    <section class="info-block" id="infoEventsBlock">
      <div class="info-block-label">Special events</div>
      <div class="info-holidays" id="infoEvents"><span class="info-dim">Loading…</span></div>
    </section>
  </div>

  <script src="tooltip.js"></script>
  <script src="info.js"></script>
</body>
</html>
