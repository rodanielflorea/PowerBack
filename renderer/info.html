<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Info</title>
  <link rel="stylesheet" href="info.css" />
</head>
<body>
  <header class="info-header">
    <span class="info-loc" id="infoLoc">—</span>
    <div class="info-header-btns">
      <button class="info-btn" id="infoRefresh" title="Refresh">&#8635;</button>
      <button class="info-btn" id="infoClose" title="Close">&times;</button>
    </div>
  </header>

  <section class="info-clock">
    <div class="info-time" id="infoTime">--:--</div>
    <div class="info-date" id="infoDate">—</div>
    <div class="info-tz" id="infoTz"></div>
  </section>

  <section class="info-block" id="infoWeatherBlock">
    <div class="info-block-label">Weather</div>
    <div class="info-weather" id="infoWeather"><span class="info-dim">Loading…</span></div>
  </section>

  <section class="info-block" id="infoHolidaysBlock">
    <div class="info-block-label">Holidays</div>
    <div class="info-holidays" id="infoHolidays"><span class="info-dim">Loading…</span></div>
  </section>

  <script src="info.js"></script>
</body>
</html>
