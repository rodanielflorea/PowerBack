<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Toggle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    /* The circle is two parts: the outer band is a native drag handle (the only
       way to move a window on Wayland — it cannot take clicks), the inner disc
       is the button. On Windows/macOS the inner disc can be dragged as well. */
    .ring {
      width: 100%; height: 100%; border-radius: 50%;
      padding: 10px;
      background: linear-gradient(135deg, #1d4ed8 0%, #1e3a8a 100%);
      box-shadow: 0 6px 16px rgba(15,18,34,.30), 0 0 0 2px rgba(255,255,255,.85);
      cursor: move;
      -webkit-app-region: drag;
      -webkit-user-select: none; user-select: none;
    }
    .btn {
      -webkit-app-region: no-drag;
      width: 100%; height: 100%; border-radius: 50%; border: none; cursor: pointer;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: #fff; font: 700 13px/1 system-ui, -apple-system, 'Segoe UI', sans-serif;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.25);
      display: flex; align-items: center; justify-content: center;
      transition: transform .12s ease, filter .12s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(.94); }
    body.manual-drag .ring { -webkit-app-region: no-drag; padding: 4px; }
    body.manual-drag .btn { cursor: grab; }
    body.manual-drag .btn:active { cursor: grabbing; }
    /* Main window hidden: dim the button so the state is obvious. */
    body.main-hidden .ring { background: linear-gradient(135deg, #475569, #334155); }
    body.main-hidden .btn { background: linear-gradient(135deg, #64748b, #475569); }
  </style>
</head>
<body>
  <div class="ring">
    <button class="btn" id="btn" title="Click: show / hide the app (Ctrl+Alt+H) · Drag: move this button">A</button>
  </div>
  <script>
    const btn = document.getElementById('btn');
    const ring = document.querySelector('.ring');
    // Whole-area drag (Windows/macOS/X11): main moves the window while the
    // pointer is held; pointer capture keeps delivering events even when the
    // cursor slips outside this tiny window. A press without movement toggles.
    // On Wayland only the outer band (a native drag region) can move the window.
    let press = null;
    const onDown = (e) => {
      if (e.button !== 0 || !document.body.classList.contains('manual-drag')) return;
      press = { x: e.screenX, y: e.screenY, moved: false, id: e.pointerId };
      try { ring.setPointerCapture(e.pointerId); } catch {}
      window.floatApi.dragStart();
    };
    const onMove = (e) => {
      if (!press) return;
      if (Math.abs(e.screenX - press.x) + Math.abs(e.screenY - press.y) > 4) press.moved = true;
    };
    const onUp = (e) => {
      if (!press) return;
      const moved = press.moved;
      try { ring.releasePointerCapture(press.id); } catch {}
      press = null;
      window.floatApi.dragEnd();
      if (!moved && e && e.type === 'pointerup' && e.target === btn) window.floatApi.toggle();
    };
    ring.addEventListener('pointerdown', onDown);
    ring.addEventListener('pointermove', onMove);
    ring.addEventListener('pointerup', onUp);
    ring.addEventListener('pointercancel', () => onUp(null));
    window.addEventListener('blur', () => onUp(null));
    // Wayland: the inner disc is a plain button.
    btn.addEventListener('click', () => { if (!document.body.classList.contains('manual-drag')) window.floatApi.toggle(); });
    window.floatApi.onCaps((caps) => { document.body.classList.toggle('manual-drag', !!(caps && caps.manualDrag)); });
    window.floatApi.onState((visible) => {
      document.body.classList.toggle('main-hidden', !visible);
      btn.title = (visible ? 'Click: hide the app' : 'Click: show the app') + ' (Ctrl+Alt+H) · Drag: move this button';
    });
  </script>
</body>
</html>
