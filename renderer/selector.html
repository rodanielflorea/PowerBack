<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    /* The screen as it was when Alt+S was pressed, frozen, dimmed everywhere
       but the area being picked. */
    html, body {
      margin: 0; padding: 0;
      height: 100vh; width: 100vw;
      background: #000 center / 100% 100% no-repeat;
      overflow: hidden;
      cursor: default !important;
      user-select: none;
    }
    *, *::before, *::after { cursor: inherit !important; }
    .shade { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.38); pointer-events: none; }
    body.picking .shade { display: none; }
    .hint {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: #181b23; color: #e7e9ef; padding: 7px 14px; border-radius: 8px;
      border: 1px solid #353b48;
      font: 12.5px "Segoe UI Variable Text", "Segoe UI", -apple-system, sans-serif;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      z-index: 10;
    }
    .box {
      position: absolute;
      border: 2px solid #7c6cff;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.38);
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <div class="shade"></div>
  <div class="hint">Drag to select the area · Esc to cancel</div>
  <div class="box" id="box"></div>
  <script src="selector.js"></script>
</body>
</html>
