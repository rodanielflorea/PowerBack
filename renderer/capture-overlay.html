<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      background: transparent;
      pointer-events: none;
      overflow: hidden;
    }
    .frame {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      border: 3px solid #ef4444;
      box-sizing: border-box;
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.4) inset, 0 0 8px rgba(239, 68, 68, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { border-color: #ef4444; }
      50% { border-color: #fca5a5; }
    }
    .label {
      position: fixed;
      top: 4px;
      left: 4px;
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      font-family: -apple-system, "Segoe UI", sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="label">OCR · capturing</div>
</body>
</html>
