<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' blob:; connect-src 'self' blob:" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="titlebar">
    <div class="drag"></div>
    <div class="slider" id="slider" title="Hover and drag horizontally to change opacity">
      <div class="slider-fill" id="sliderFill"></div>
    </div>
    <button class="btn stealth-btn" id="stealthBtn" title="Toggle stealth (hidden from screen capture)">
      <span class="stealth-dot"></span>
    </button>
    <button class="btn" id="hideBtn" title="Hide (Ctrl+Alt+H)">&minus;</button>
    <button class="btn" id="quitBtn" title="Quit">&times;</button>
  </header>

  <aside class="rail">
    <button class="rail-btn" id="urlMenuBtn" title="Switch site">&#9662;</button>
    <button class="rail-btn" id="settingsBtn" title="Settings">&#9881;</button>
    <button class="rail-btn rec-btn" id="recBtn" title="Start transcription">
      <span class="rec-dot"></span>
    </button>
  </aside>

  <section class="settings-overlay" id="settingsOverlay" hidden>
    <div class="settings-header">
      <span>Settings</span>
      <button class="btn" id="settingsCloseBtn" title="Close settings">&times;</button>
    </div>
    <div class="settings-body">

      <section class="settings-section">
        <h3>Web URLs</h3>
        <p class="hint">Add the sites you want available from the dropdown on the left.</p>
        <div class="url-list" id="urlList"></div>
        <div class="url-add">
          <input type="text" id="urlInput" placeholder="https://chatgpt.com" spellcheck="false" />
          <button id="urlAddBtn">Add</button>
        </div>
      </section>

      <section class="settings-section">
        <h3>Audio capture</h3>
        <div class="field">
          <label for="micSelect">Microphone</label>
          <select id="micSelect"></select>
        </div>
        <div class="field-row">
          <label class="checkbox"><input type="checkbox" id="captureMic" /> Capture microphone</label>
          <label class="checkbox"><input type="checkbox" id="captureSystem" /> Capture system audio (loopback)</label>
        </div>
      </section>

      <section class="settings-section">
        <h3>Transcription</h3>
        <div class="field-row">
          <label class="radio"><input type="radio" name="engine" value="openai" id="engineOpenai" /> OpenAI Whisper API</label>
          <label class="radio"><input type="radio" name="engine" value="local" id="engineLocal" /> Local whisper.cpp</label>
        </div>
        <div class="field" id="openaiBlock">
          <label for="openaiKey">OpenAI API key</label>
          <input type="password" id="openaiKey" placeholder="sk-..." spellcheck="false" />
        </div>
        <div class="field" id="localExeBlock">
          <label for="whisperExe">whisper.exe path</label>
          <div class="path-row">
            <input type="text" id="whisperExe" placeholder="C:\path\to\whisper-cli.exe" spellcheck="false" />
            <button id="whisperExeBrowse">Browse</button>
          </div>
        </div>
        <div class="field" id="localModelBlock">
          <label for="whisperModel">Whisper model file</label>
          <div class="path-row">
            <input type="text" id="whisperModel" placeholder="C:\path\to\ggml-base.bin" spellcheck="false" />
            <button id="whisperModelBrowse">Browse</button>
          </div>
        </div>
        <div class="field">
          <label for="languageSelect">Language</label>
          <select id="languageSelect">
            <option value="auto">Auto-detect</option>
            <option value="en">English</option>
            <option value="ru">Russian</option>
            <option value="ko">Korean</option>
            <option value="ja">Japanese</option>
            <option value="zh">Chinese</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="pt">Portuguese</option>
            <option value="it">Italian</option>
            <option value="nl">Dutch</option>
            <option value="tr">Turkish</option>
            <option value="pl">Polish</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
            <option value="uk">Ukrainian</option>
          </select>
        </div>
        <p class="hint">Click the dot button on the left rail to start/stop. Transcribed text auto-pastes into the foreground app at the cursor.</p>
        <div class="log-box">
          <div class="log-header">Transcription log</div>
          <div class="log-body" id="logBody"></div>
        </div>
      </section>

    </div>
  </section>

  <script src="renderer.js"></script>
</body>
</html>
