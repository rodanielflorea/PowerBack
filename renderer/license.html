<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ace</title>
  <style>
    :root {
      --bg: #ffffff; --surface: #f6f7fb; --border: #e4e7ef; --border-hi: #c9cdd8;
      --text: #0f1222; --muted: #6b7085; --accent: #5b4cf0; --accent-hover: #4a3bd9;
      --danger: #dc2626; --green: #16a34a;
      --shadow-sm: 0 1px 2px rgba(15,18,34,.04), 0 2px 8px rgba(15,18,34,.06);
      --ease: cubic-bezier(.4,0,.2,1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--text); font-size: 13.5px; line-height: 1.45;
      background:
        radial-gradient(520px 280px at 10% -10%, rgba(91,76,240,.10), transparent 70%),
        linear-gradient(180deg, #f8f9fd 0%, #ffffff 65%);
      padding: 22px 24px 18px;
      -webkit-user-select: none; user-select: none;
      display: flex; flex-direction: column;
    }
    .head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .badge {
      width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px;
      background: linear-gradient(135deg, rgba(91,76,240,.16), rgba(91,76,240,.06));
      border: 1px solid rgba(91,76,240,.14);
      display: flex; align-items: center; justify-content: center; font-size: 19px;
    }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
    .step { font-size: 11.5px; font-weight: 650; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
    .step b { display: inline-flex; width: 18px; height: 18px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; align-items: center; justify-content: center; margin-right: 7px; vertical-align: -3px; }
    .mac-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 8px 8px 8px 14px;
      box-shadow: var(--shadow-sm);
    }
    .mac-row code { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 15px; letter-spacing: 1.5px; flex: 1; user-select: text; -webkit-user-select: text; }
    button {
      font: inherit; font-weight: 600; border: 1px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: 10px; padding: 8px 14px; cursor: pointer;
      transition: background .14s var(--ease), border-color .14s var(--ease), transform .14s var(--ease), box-shadow .14s var(--ease);
    }
    button:hover { background: var(--surface); border-color: var(--border-hi); }
    button:active { transform: translateY(1px); }
    button.primary {
      background: linear-gradient(135deg, #7c6cff 0%, #5b4cf0 100%); color: #fff; border-color: transparent;
      box-shadow: 0 6px 16px rgba(91,76,240,.28); padding: 10px 22px;
    }
    button.primary:hover { background: linear-gradient(135deg, #6b5af5 0%, #4a3bd9 100%); box-shadow: 0 8px 20px rgba(91,76,240,.34); }
    button.primary:disabled { opacity: .6; box-shadow: none; }
    button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
    button.ghost:hover { background: var(--surface); color: var(--text); }
    textarea {
      width: 100%; height: 74px; font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12px; line-height: 1.5;
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; resize: none; background: var(--bg);
      box-shadow: var(--shadow-sm); color: var(--text);
      -webkit-user-select: text; user-select: text;
      transition: border-color .14s var(--ease), box-shadow .14s var(--ease);
    }
    textarea::placeholder { color: #a0a4b5; }
    textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,76,240,.15); }
    #status { font-size: 12.5px; min-height: 40px; margin-top: 2px; color: var(--muted); }
    #status.err { color: var(--danger); }
    #status.ok { color: var(--green); }
    .actions { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; }
  </style>
</head>
<body>
  <div class="head">
    <div class="badge">🔐</div>
    <div>
      <h1>Approve this computer</h1>
      <div class="sub">Ace works once your administrator approves this computer on ace2me.com.</div>
    </div>
  </div>

  <p class="step"><b>1</b>Send this computer's ID to your administrator</p>
  <div class="mac-row">
    <code id="mac">…</code>
    <button id="copyBtn">Copy</button>
  </div>

  <p class="step"><b>2</b>Wait for the approval</p>
  <div id="status">Checking…</div>

  <div class="actions">
    <button id="quitBtn" class="ghost">Quit</button>
    <button id="okBtn" class="primary">Check now</button>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    function show(info) {
      $('mac').textContent = info.mac || 'no network adapter found';
      const st = $('status');
      if (info.state === 'terminated') {
        st.className = 'err';
        st.textContent = info.message || 'This computer was turned off for Ace by the administrator.';
      } else if (info.state === 'offline') {
        st.className = 'err';
        st.textContent = 'Cannot reach ace2me.com. Check the internet connection; Ace keeps trying every 10 seconds.';
      } else if (info.state === 'approved') {
        st.className = 'ok';
        st.textContent = 'Approved. Starting…';
      } else {
        st.className = '';
        st.textContent = info.reason === 'new-install'
          ? 'Ace was installed again on this computer: the administrator needs to approve it once more. Ace checks every 10 seconds and starts by itself.'
          : 'Waiting for the administrator. Ace checks every 10 seconds and starts by itself once approved.';
      }
    }
    window.licenseApi.getInfo().then(show);
    window.licenseApi.onState(show);
    $('copyBtn').onclick = async () => {
      await window.licenseApi.copyMac();
      $('copyBtn').textContent = 'Copied ✓';
      setTimeout(() => { $('copyBtn').textContent = 'Copy'; }, 1400);
    };
    $('quitBtn').onclick = () => window.licenseApi.quit();
    $('okBtn').onclick = async () => {
      $('okBtn').disabled = true;
      $('status').className = ''; $('status').textContent = 'Checking…';
      try { show(await window.licenseApi.check()); } finally { $('okBtn').disabled = false; }
    };
  </script>
</body>
</html>
